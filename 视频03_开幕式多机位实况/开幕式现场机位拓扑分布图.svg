<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;">
  <defs>
    <!-- 底色渐变 -->
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>

    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- 视角光锥渐变 -->
    <!-- 机位1: 台上 30° 斜向左 (Amber) -->
    <linearGradient id="coneCam1" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.4)"/>
      <stop offset="100%" stop-color="rgba(245, 158, 11, 0.03)"/>
    </linearGradient>

    <!-- 机位2: 草坪正对主席台 (Cyan) -->
    <linearGradient id="coneCam2" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0.35)"/>
      <stop offset="100%" stop-color="rgba(6, 182, 212, 0.02)"/>
    </linearGradient>

    <!-- 机位3: 台下正对队员 (Rose) -->
    <linearGradient id="coneCam3" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="rgba(244, 63, 94, 0.35)"/>
      <stop offset="100%" stop-color="rgba(244, 63, 94, 0.02)"/>
    </linearGradient>

    <!-- 机位4: 领导后方越肩 (Emerald) -->
    <linearGradient id="coneCam4" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.3)"/>
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.02)"/>
    </linearGradient>

    <!-- 机位5: 跑道中线贴地朝左 (Purple) -->
    <linearGradient id="coneCam5Left" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.5)"/>
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0.03)"/>
    </linearGradient>

    <!-- 箭头标记 -->
    <marker id="arrowMarch" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#facc15"/>
    </marker>
    <marker id="arrowGoal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowAngle" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- 顶部简明标题 -->
  <g transform="translate(60, 20)">
    <rect x="0" y="0" width="1080" height="38" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="24" fill="#f8fafc" font-size="16" font-weight="bold">校运会开幕式 · 现场机位部署拓扑图</text>
    <text x="830" y="24" fill="#94a3b8" font-size="12">5 路核心定点机位 ｜ 跑道中线贴地朝左</text>
  </g>

  <!-- ───────────────────────────────────────────────────────────── -->
  <!-- 场景主体 (y: 68 -> 700)                                       -->
  <!-- ───────────────────────────────────────────────────────────── -->

  <!-- 1. 上半部：内场绿茵草坪 -->
  <rect x="60" y="68" width="1080" height="190" rx="10" fill="url(#grassGrad)" stroke="#15803d" stroke-width="1.5"/>
  <circle cx="560" cy="68" r="45" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <text x="460" y="118" fill="rgba(255,255,255,0.2)" font-size="16" font-weight="bold" letter-spacing="4">内 场 草 坪</text>

  <!-- 右侧足球门 (入草坪口) -->
  <g transform="translate(970, 175)">
    <rect x="0" y="0" width="75" height="55" fill="rgba(255,255,255,0.08)" stroke="#ffffff" stroke-width="2"/>
    <line x1="0" y1="0" x2="15" y2="-15" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="75" y1="0" x2="90" y2="-15" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="15" y1="-15" x2="90" y2="-15" stroke="#ffffff" stroke-width="1.5"/>
    <text x="38" y="72" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">足球门 (入草坪)</text>
  </g>

  <!-- 2. 中间部：直道跑道 (Straightaway Track) -->
  <rect x="60" y="268" width="1080" height="180" fill="url(#trackGrad)" stroke="#7f1d1d" stroke-width="1.5"/>

  <!-- 跑道分道白线 -->
  <line x1="60" y1="298" x2="1140" y2="298" stroke="rgba(255,255,255,0.25)" stroke-width="1" stroke-dasharray="6,6"/>
  <line x1="60" y1="328" x2="1140" y2="328" stroke="rgba(255,255,255,0.25)" stroke-width="1" stroke-dasharray="6,6"/>
  
  <!-- ★ 跑道正中间那条线 (Center Line) ★ -->
  <line x1="60" y1="358" x2="1140" y2="358" stroke="rgba(255,255,255,0.7)" stroke-width="2"/>
  <text x="90" y="352" fill="rgba(255,255,255,0.4)" font-size="10">跑道正中线</text>

  <line x1="60" y1="388" x2="1140" y2="388" stroke="rgba(255,255,255,0.25)" stroke-width="1" stroke-dasharray="6,6"/>
  <line x1="60" y1="418" x2="1140" y2="418" stroke="rgba(255,255,255,0.25)" stroke-width="1" stroke-dasharray="6,6"/>

  <!-- 队伍行进动线 -->
  <g>
    <!-- 进场 -->
    <line x1="80" y1="358" x2="330" y2="358" stroke="#facc15" stroke-width="3.5" stroke-dasharray="8,5" marker-end="url(#arrowMarch)"/>
    <text x="180" y="380" fill="#facc15" font-size="11" font-weight="bold" text-anchor="middle">队伍自左向右行进 ➔</text>

    <!-- 退场走入足球门 -->
    <path d="M 770,358 L 1030,358 C 1050,358 1060,300 1025,260 L 1005,240" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="7,4" marker-end="url(#arrowGoal)"/>
    <text x="890" y="380" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">走入足球门 ➔</text>
  </g>

  <!-- 核心表演定点区 (表演区) -->
  <rect x="440" y="283" width="320" height="150" rx="6" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="600" y="413" fill="#fef08a" font-size="13" font-weight="bold" text-anchor="middle">★ 班级定点展演区 ★</text>

  <!-- 3. 下半部：主席台 (VIP Podium) -->
  <rect x="280" y="463" width="630" height="245" rx="8" fill="url(#podiumGrad)" stroke="#475569" stroke-width="1.5"/>
  
  <!-- 领导席桌位 -->
  <rect x="320" y="528" width="550" height="45" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="595" y="555" fill="#cbd5e1" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="3">主 席 台 前 排 领 导 席</text>

  <!-- ───────────────────────────────────────────────────────────── -->
  <!-- 视角光锥绘制                                                 -->
  <!-- ───────────────────────────────────────────────────────────── -->

  <!-- ★ 机位 1 视角：台上向左 30° 斜迎面 -->
  <polygon points="720,508 160,188 100,368" fill="url(#coneCam1)"/>
  <line x1="720" y1="508" x2="160" y2="188" stroke="#f59e0b" stroke-width="1.4" stroke-opacity="0.9"/>
  <line x1="720" y1="508" x2="100" y2="368" stroke="#f59e0b" stroke-width="1.4" stroke-opacity="0.9"/>
  
  <!-- 30° 标注弧线 -->
  <line x1="720" y1="508" x2="520" y2="508" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M 640,508 A 80,80 0 0,1 650,468" fill="none" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arrowAngle)"/>
  <text x="635" y="490" fill="#fbbf24" font-size="11" font-weight="bold">30°</text>

  <!-- ★ 机位 2 视角：草坪正对主席台 -->
  <polygon points="600,188 330,463 870,463" fill="url(#coneCam2)"/>
  <line x1="600" y1="188" x2="330" y2="463" stroke="#06b6d4" stroke-width="1.4" stroke-opacity="0.9"/>
  <line x1="600" y1="188" x2="870" y2="463" stroke="#06b6d4" stroke-width="1.4" stroke-opacity="0.9"/>

  <!-- ★ 机位 3 视角：台下正对队员 -->
  <polygon points="600,463 440,283 760,283" fill="url(#coneCam3)"/>
  <line x1="600" y1="463" x2="440" y2="283" stroke="#f43f5e" stroke-width="1.4" stroke-opacity="0.9"/>
  <line x1="600" y1="463" x2="760" y2="283" stroke="#f43f5e" stroke-width="1.4" stroke-opacity="0.9"/>

  <!-- ★ 机位 4 视角：领导后方越肩 -->
  <polygon points="600,628 380,278 820,278" fill="url(#coneCam4)"/>
  <line x1="600" y1="628" x2="380" y2="278" stroke="#10b981" stroke-width="1.4" stroke-opacity="0.8"/>
  <line x1="600" y1="628" x2="820" y2="278" stroke="#10b981" stroke-width="1.4" stroke-opacity="0.8"/>

  <!-- ★ 机位 5 视角：表演区左侧中线贴地 · 朝左 -->
  <polygon points="380,358 160,298 160,418" fill="url(#coneCam5Left)"/>
  <line x1="380" y1="358" x2="160" y2="298" stroke="#c026d3" stroke-width="1.4" stroke-opacity="0.9"/>
  <line x1="380" y1="358" x2="160" y2="418" stroke="#c026d3" stroke-width="1.4" stroke-opacity="0.9"/>

  <!-- ───────────────────────────────────────────────────────────── -->
  <!-- 机位图标与标签                                               -->
  <!-- ───────────────────────────────────────────────────────────── -->

  <!-- 机位 1：台上 (向左30°斜切) -->
  <g transform="translate(720, 508)">
    <circle cx="0" cy="0" r="14" fill="#d97706" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
    <rect x="-8" y="14" width="85" height="38" rx="4" fill="#0f172a" stroke="#d97706" stroke-width="1.2"/>
    <text x="34" y="29" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">机位 1</text>
    <text x="34" y="44" fill="#fde68a" font-size="10" text-anchor="middle">主席台台上</text>
  </g>

  <!-- 机位 2：草坪正中 -->
  <g transform="translate(600, 183)">
    <circle cx="0" cy="0" r="14" fill="#0891b2" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
    <rect x="-42" y="-45" width="85" height="38" rx="4" fill="#0f172a" stroke="#0891b2" stroke-width="1.2"/>
    <text x="0" y="-30" fill="#22d3ee" font-size="12" font-weight="bold" text-anchor="middle">机位 2</text>
    <text x="0" y="-15" fill="#bae6fd" font-size="10" text-anchor="middle">草坪正中</text>
  </g>

  <!-- 机位 3：台下正前 -->
  <g transform="translate(600, 468)">
    <circle cx="0" cy="0" r="14" fill="#e11d48" stroke="#fb7185" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
    <rect x="-95" y="-18" width="85" height="38" rx="4" fill="#0f172a" stroke="#e11d48" stroke-width="1.2"/>
    <text x="-52" y="-3" fill="#fb7185" font-size="12" font-weight="bold" text-anchor="middle">机位 3</text>
    <text x="-52" y="12" fill="#fecdd3" font-size="10" text-anchor="middle">主席台台下</text>
  </g>

  <!-- 机位 4：主席台后方 -->
  <g transform="translate(600, 633)">
    <circle cx="0" cy="0" r="14" fill="#059669" stroke="#34d399" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
    <rect x="-42" y="14" width="85" height="38" rx="4" fill="#0f172a" stroke="#059669" stroke-width="1.2"/>
    <text x="0" y="29" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle">机位 4</text>
    <text x="0" y="44" fill="#a7f3d0" font-size="10" text-anchor="middle">主席台后方</text>
  </g>

  <!-- 机位 5：表演区左侧中线贴地 (朝左) -->
  <g transform="translate(380, 358)">
    <circle cx="0" cy="0" r="12" fill="#c026d3" stroke="#e879f9" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    <rect x="-98" y="-18" width="90" height="38" rx="4" fill="#0f172a" stroke="#c026d3" stroke-width="1.2"/>
    <text x="-53" y="-3" fill="#e879f9" font-size="12" font-weight="bold" text-anchor="middle">机位 5</text>
    <text x="-53" y="12" fill="#f5d0fe" font-size="10" text-anchor="middle">跑道中线贴地</text>
  </g>

  <!-- ───────────────────────────────────────────────────────────── -->
  <!-- 底部备忘栏 (包含连续长录铁律、机动云台与现场动线)             -->
  <!-- ───────────────────────────────────────────────────────────── -->
  <g transform="translate(60, 720)">
    <rect x="0" y="0" width="1080" height="80" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    
    <!-- 连续长录铁律 -->
    <text x="20" y="24" fill="#ef4444" font-size="12" font-weight="bold">● 录制铁律（特别提示）：</text>
    <text x="170" y="24" fill="#fecdd3" font-size="12" font-weight="bold">所有机型能拍多少时间都尽量一直录着，尽量少分段，这样后面多机位对齐比较方便！</text>

    <!-- 机动云台特写 -->
    <text x="20" y="46" fill="#38bdf8" font-size="11" font-weight="bold">● 机动云台抓拍：</text>
    <text x="120" y="46" fill="#e2e8f0" font-size="11">手持云台自由跑动，着重抓拍核心人物特写（班牌举牌员坚毅眼神、领操员、班主任陪跑笑脸、特色道具）。</text>

    <!-- 现场动线说明 -->
    <text x="20" y="66" fill="#a855f7" font-size="11" font-weight="bold">● 现场动线说明：</text>
    <text x="130" y="66" fill="#cbd5e1" font-size="11">方阵队伍自左向右行进，主席台前完成定点展演后，继续直行向右至最右侧足球门拐入草坪大矩阵。</text>
  </g>
</svg>
