<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 春晖中学校运会 · 摄制工作引导与排班看板</title>
    <meta name="description" content="浙江省春晖中学2026年校运会摄制现场工作引导系统，专为希沃触控交互白板设计。包含时间、比赛、人员、内容、拍摄提示及社员参赛避让预警。">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 顶部希沃白板控制栏 -->
    <header class="header-bar">
        <div class="brand-section">
            <div class="brand-logo">📋</div>
            <div class="brand-text">
                <h1>春晖中学2026校运会 · 摄制引导与排班看板</h1>
                <span class="brand-tag">希沃白板触控大屏专用 · 实战操作版</span>
            </div>
        </div>

        <!-- 赛程日触控切换大胶囊 -->
        <nav class="day-switcher" aria-label="运动会日期选择">
            <button class="day-tab active" data-day-idx="0">
                <span class="tab-icon">🚩</span>
                <span class="tab-title">10.8 Day 1</span>
                <span class="tab-sub">开幕式 · 飞人预赛 · 铅球力量</span>
            </button>
            <button class="day-tab" data-day-idx="1">
                <span class="tab-icon">⚡</span>
                <span class="tab-title">10.9 Day 2</span>
                <span class="tab-sub">跳高背弓 · 百米决战 · 4x100接力</span>
            </button>
            <button class="day-tab" data-day-idx="2">
                <span class="tab-icon">🏆</span>
                <span class="tab-title">10.10 Day 3</span>
                <span class="tab-sub">千米长跑 · 800m温情 · 闭幕颁奖</span>
            </button>
        </nav>

        <!-- 顶部操作按钮 -->
        <div class="top-actions">
            <div class="search-box">
                <input type="text" id="input-search" placeholder="🔍 搜项目 / 搜人员..." autocomplete="off">
            </div>
            <button class="touch-btn touch-btn-primary" id="btn-fullscreen" title="切换希沃白板全屏模式">
                <span>⛶</span>
                <span>全屏演示</span>
            </button>
        </div>
    </header>

    <!-- 次级导航栏：快速分类筛选与 21 人快速点名抽屉 -->
    <nav class="sub-nav-bar" aria-label="快捷分类与人员点名">
        <div class="category-filters">
            <button class="filter-chip active" data-cat="all">全部赛段</button>
            <button class="filter-chip" data-cat="径赛">🏃 径赛</button>
            <button class="filter-chip" data-cat="田赛">🪜 田赛</button>
            <button class="filter-chip" data-cat="仪式">🏛️ 仪式与交接</button>
            <button class="filter-chip alert-chip" data-cat="alert">🚨 仅看参赛避让预警</button>
        </div>

        <div class="member-roster-bar">
            <span class="roster-label">👥 人员快速查岗：</span>
            <div class="member-chips-scroll" id="member-chips-container">
                <!-- 由 JS 渲染 21 位成员按钮 -->
            </div>
            <button class="clear-filter-btn" id="btn-clear-filter" style="display: none;">✕ 清除人员筛选</button>
        </div>
    </nav>

    <!-- 主展示区：模块化赛事实战看板列表 -->
    <main class="board-main-container">
        <!-- 当前视图状态提示条 -->
        <div class="board-status-header">
            <div class="status-left">
                <h2 id="current-day-title">10月8日 (周四) Day 1</h2>
                <span class="status-theme" id="current-day-theme">开幕式盛典 · 飞人预赛首战 · 铅球力量 · 幕后初动</span>
            </div>
            <div class="status-stats" id="current-stats-count">共 6 个赛程节点</div>
        </div>

        <!-- 核心卡片列表容器 -->
        <div class="cards-list-view" id="cards-container">
            <!-- 由 JS 严格依据权威数据渲染 -->
        </div>
    </main>

    <!-- 底部现场三大铁律条 -->
    <footer class="footer-rules-bar">
        <div class="rule-item">
            <span class="rule-badge">铁律 1</span>
            <span class="rule-title">连拍机内打星：</span>
            <span class="rule-desc">赛隙即时回看机内打星（Rating 1~5星），精简废片率，优先筛选 4/5 星高光。</span>
        </div>
        <div class="rule-item">
            <span class="rule-badge">铁律 2</span>
            <span class="rule-title">拷卡三级目录：</span>
            <span class="rule-desc">素材严格按 日期 / 比赛项目 / 机型(拍摄者) 归档，双备份校验后在机内格式化。</span>
        </div>
        <div class="rule-item">
            <span class="rule-badge">铁律 3</span>
            <span class="rule-title">突发意外不关机：</span>
            <span class="rule-desc">赛场摔倒、脱力倒地、交接掉棒绝对不关机！稳步推进抓拍搀扶、递水擦汗温情画面。</span>
        </div>
    </footer>

    <!-- 数据与逻辑驱动脚本 -->
    <script src="stadium-data.js"></script>
    <script src="app.js"></script>
</body>
</html>
